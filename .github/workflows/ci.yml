name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, lint, docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Injected Develocity plugins add artifacts that dependency
          # verification cannot know about ahead of time.
          develocity-injection-enabled: "false"

      - name: Spotless (formatting)
        run: ./gradlew spotlessCheck --no-configuration-cache

      - name: Detekt (static analysis)
        run: ./gradlew detekt --no-configuration-cache

      - name: Check public ABI
        run: ./gradlew :wirokit:releaseApiCheck --no-configuration-cache

      - name: SDK unit tests and coverage gate
        run: >
          ./gradlew
          :wirokit:testDebugUnitTest
          :wirokit:verifyCoverageGate
          --no-configuration-cache

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --no-configuration-cache

      - name: Android Lint
        run: >
          ./gradlew
          :wirokit:lintDebug
          :app:lintDebug
          --no-configuration-cache

      - name: Compile instrumentation tests
        run: >
          ./gradlew
          :wirokit:compileDebugAndroidTestKotlin
          :app:compileDebugAndroidTestKotlin
          --no-configuration-cache

      - name: Build debug and minified release
        run: >
          ./gradlew
          :app:assembleDebug
          :app:assembleRelease
          :wirokit:assembleRelease
          --no-configuration-cache

      - name: Generate Dokka
        run: ./gradlew :wirokit:dokkaGenerate --no-configuration-cache

      - name: Publish to Maven Local and verify consumer fixture
        run: |
          ./gradlew :wirokit:publishToMavenLocal --no-configuration-cache
          ./gradlew :consumer-fixture:testDebugUnitTest --no-configuration-cache

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/kover/**
            **/build/dokka/**
          if-no-files-found: ignore

  emulator:
    name: Offline instrumentation (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 37]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          develocity-injection-enabled: "false"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run credential-free androidTest
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          script: >
            ./gradlew
            :app:connectedDebugAndroidTest
            :wirokit:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notAnnotation=androidx.test.filters.LargeTest
            --no-configuration-cache

      - name: Upload emulator reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
