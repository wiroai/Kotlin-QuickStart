name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.event.repository.visibility == 'public'
    name: Publish Maven Central and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: maven-central
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          develocity-injection-enabled: "false"

      - name: Verify tag and version
        shell: bash
        run: |
          version="$(awk -F'"' '/^wirokit = / { print $2 }' gradle/libs.versions.toml)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -n "${version}"
          if [[ "${version}" == *-SNAPSHOT ]]; then
            exit 1
          fi
          grep -Fq "ai.wiro:wirokit:${version}" README.md
          grep -Fq "## [${version}]" CHANGELOG.md

      - name: Verify release candidate
        run: >
          ./gradlew
          spotlessCheck
          detekt
          :wirokit:testDebugUnitTest
          :wirokit:verifyCoverageGate
          :wirokit:lintRelease
          :wirokit:assembleRelease
          :wirokit:dokkaGenerate
          :wirokit:releaseApiCheck
          --no-configuration-cache

      - name: Publish and release on Maven Central
        run: >
          ./gradlew
          :wirokit:publishAndReleaseToMavenCentral
          --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: "true"
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Create GitHub release
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
          --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
